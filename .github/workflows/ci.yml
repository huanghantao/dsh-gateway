name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is in the matrix because the gateway is normally deployed
        # alongside a desktop DeepSeek Harness install, and the process
        # supervision and file-locking behaviour it depends on are the parts most
        # likely to differ between platforms.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Read the pin that already exists rather than restating it: two
          # sources of truth for the toolchain is how a local goenv and CI
          # silently diverge.
          go-version-file: .go-version
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The Go build embeds web/dist, so the frontend must exist before anything
      # compiles. The bundle is not committed, which makes this step load-bearing
      # rather than a drift check: without it, every job below fails to compile.
      - name: Build the web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal web)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race ./... -timeout 600s

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Read the pin that already exists rather than restating it: two
          # sources of truth for the toolchain is how a local goenv and CI
          # silently diverge.
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build the web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Type-check the frontend
        working-directory: web
        run: npx tsc --noEmit
      # The browser tier (`make e2e`) is deliberately not a CI job: it needs a
      # running gateway, which needs a `dsh` install and a model credential, and
      # neither belongs in a fork-safe workflow. It is also the only thing that
      # exercises web/src at runtime, so at least prove it parses and that its
      # module graph resolves — a typo there would otherwise be found by whoever
      # next runs it locally, which may be nobody.
      - name: Check the end-to-end script parses
        run: |
          node --check scripts/e2e-browser.mjs
          for f in web/scripts/*.mjs; do node --check "$f"; done
      # Pinned rather than `latest`. The configuration uses schema
      # `version: "2"`, so the first v3 release would turn every branch red,
      # including old commits, with no change on this side. v2.14.0 is the
      # version this tree was actually run against; bump it deliberately, with
      # the config, in one commit.
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          args: --timeout 5m

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Read the pin that already exists rather than restating it: two
          # sources of truth for the toolchain is how a local goenv and CI
          # silently diverge.
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build the web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build
        run: make build VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-gateway-linux-amd64
          path: bin/dsh-gateway

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the deployment scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning deploy/vps/install.sh deploy/mac/install.sh

      # The installer's argument parser is the one part of it that can be
      # exercised without root, a VPS or the network, and it is worth exercising:
      # a case branch that forgets `shift 2` does not fail loudly, it spins
      # forever on the same argument. Exit 124 is therefore a distinct failure
      # from exit 1, and the test treats it as one.
      - name: Check the installer parses its arguments
        run: |
          set -euo pipefail

          status=0
          timeout 10 bash deploy/vps/install.sh --domain example.com --nope >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::an unknown argument after --domain must be rejected with exit 1, got $status"
            echo "(124 means the parser never consumed --domain's value, so it looped)"
            exit 1
          fi

          status=0
          timeout 10 bash deploy/vps/install.sh --tls bogus >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::--tls bogus must be rejected with exit 1, got $status"
            exit 1
          fi

          # No root, no side effects: --help must print usage and stop.
          bash deploy/vps/install.sh --help >/dev/null
